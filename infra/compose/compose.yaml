name: roammand

services:
  signaling:
    build:
      context: ../..
      dockerfile: services/signaling/Dockerfile
    image: roammand-signaling:0.0.1
    restart: unless-stopped
    stop_grace_period: 65s
    pids_limit: 256
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SIGNALING_LISTEN_ADDR: "0.0.0.0:8443"
      SIGNALING_TLS_CERT_FILE: /run/secrets/tls_cert
      SIGNALING_TLS_KEY_FILE: /run/secrets/tls_key
      SIGNALING_TRUSTED_PROXY_CIDRS: "${SIGNALING_TRUSTED_PROXY_CIDRS:-}"
      SIGNALING_SHUTDOWN_TIMEOUT: "${SIGNALING_SHUTDOWN_TIMEOUT:-10s}"
      SIGNALING_MAX_CONNECTIONS: "${SIGNALING_MAX_CONNECTIONS:-1024}"
      SIGNALING_MAX_CONNECTIONS_PER_IP: "${SIGNALING_MAX_CONNECTIONS_PER_IP:-64}"
      SIGNALING_MAX_RENDEZVOUS: "${SIGNALING_MAX_RENDEZVOUS:-4096}"
      SIGNALING_MAX_RENDEZVOUS_PER_HOST: "${SIGNALING_MAX_RENDEZVOUS_PER_HOST:-4}"
    secrets:
      - tls_cert
      - tls_key
    ports:
      - "8443:8443/tcp"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=65532,gid=65532
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - --no-check-certificate
        - https://127.0.0.1:8443/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  coturn:
    image: coturn/coturn:4.15.0-r0@sha256:0feee4fc1f45c7c053c8fee3e1ab941b1a1b9a0429bc01e18126735410770bfd
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - /usr/local/bin/roammand-coturn-entrypoint.sh
    volumes:
      - type: bind
        source: ./coturn-entrypoint.sh
        target: /usr/local/bin/roammand-coturn-entrypoint.sh
        read_only: true
    ports:
      - "3478:3478/udp"
    tmpfs:
      - /run/roammand:rw,noexec,nosuid,nodev,size=1m,mode=0700,uid=65534,gid=65534
      - /var/lib/coturn:rw,noexec,nosuid,nodev,size=1m,mode=0700,uid=65534,gid=65534
    healthcheck:
      test:
        - CMD
        - turnutils_stunclient
        - -p
        - "3478"
        - 127.0.0.1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  tls_cert:
    file: "${TLS_CERT_FILE:?Set TLS_CERT_FILE in the env file}"
  tls_key:
    file: "${TLS_KEY_FILE:?Set TLS_KEY_FILE in the env file}"
