[workspace]
members = [
  "crates/host-agent",
  "crates/host-platform",
  "crates/host-webrtc",
  "crates/ipc",
  "crates/privileged-bridge",
  "gen/rust",
  "third_party/webrtc-sys-build",
]
resolver = "3"

[patch.crates-io]
# Keep the verified native WebRTC release while updating its ZIP build utility.
webrtc-sys-build = { path = "third_party/webrtc-sys-build" }

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MPL-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
